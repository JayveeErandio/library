name: Deploy ASP.NET to AWS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Create deployment package
        run: |
          cd publish
          zip -r ../deployment.zip .

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          TOKEN_JSON=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)
          PAYLOAD="${PAYLOAD//-/+}"
          PAYLOAD="${PAYLOAD//_/\/}"

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 -d | jq '{sub, aud}'

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create deployment bucket
        run: |
          BUCKET="library-deploy-${{ github.repository_id }}"
          echo "DEPLOY_BUCKET=$BUCKET" >> "$GITHUB_ENV"

          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "${{ vars.AWS_REGION }}"
          fi

      - name: Upload deployment package
        run: |
          aws s3 cp deployment.zip \
            "s3://${DEPLOY_BUCKET}/deployments/${{ github.sha }}.zip"

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ vars.EB_APPLICATION_NAME }}" \
            --version-label "${{ github.sha }}" \
            --source-bundle S3Bucket="${DEPLOY_BUCKET}",S3Key="deployments/${{ github.sha }}.zip"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ vars.EB_ENVIRONMENT_NAME }}" \
            --version-label "${{ github.sha }}"

      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-name "${{ vars.EB_ENVIRONMENT_NAME }}"
